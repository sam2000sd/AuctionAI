name: Keep Streamlit Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit
        run: |
          curl -L \
            --max-time 60 \
            --retry 3 \
            --retry-delay 5 \
            --user-agent "Mozilla/5.0" \
            "https://simoauction.streamlit.app/?keepalive=1"
