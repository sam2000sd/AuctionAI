name: Keep Streamlit Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Wake Streamlit App
        run: |
          echo "Pinging Streamlit..."
          curl --head \
               --silent \
               --show-error \
               --max-time 30 \
               --connect-timeout 10 \
               https://simoauction.streamlit.app/?keepalive=1
          echo "Done."
