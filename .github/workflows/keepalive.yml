name: Keep Streamlit Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Streamlit App
        run: |
          curl -I \
               --max-time 30 \
               --user-agent "Mozilla/5.0" \
               "https://simoauction.streamlit.app/?keepalive=1" || true

          echo "Ping completed"
